<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Holobiontia</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="src/ui/main.js"></script>
</head>
<body>
  <header id="top">
    <strong>Holobiontia</strong>
    <button id="play" title="Space">Play</button>
    <button id="step" title=".">Step</button>
    <label>Speed <input id="speed" type="range" min="1" max="500" value="60"> <output id="speed-out"></output></label>
    <label>Seed <input id="seed" type="number" value="1"></label>
    <button id="reset">New world</button>
    <span id="stats"></span>
  </header>

  <aside id="left">
    <h2>World</h2>
    <div id="knobs"></div>
    <h2>Overlay</h2>
    <select id="overlay">
      <option value="light">Light</option>
      <option value="vital">Vital</option>
      <option value="spent">Spent</option>
      <option value="none">None</option>
    </select>
    <div id="legend"></div>
  </aside>

  <main id="world"><canvas id="world-canvas"></canvas></main>

  <aside id="right">
    <h2>Inspector</h2>
    <dl id="inspector"></dl>
  </aside>

  <footer id="bottom"><canvas id="graph-canvas"></canvas></footer>
</body>
</html>
