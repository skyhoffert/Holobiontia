<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Holobiontia</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="src/ui/main.js"></script>
</head>
<body>
  <header id="top">
    <strong>Holobiontia</strong>
    <button id="play" title="Space">Play</button>
    <button id="step" title=".">Step</button>
    <label>Speed <input id="speed" type="range" min="1" max="500" value="60"> <output id="speed-out"></output></label>
    <label>Seed <input id="seed" type="number" value="1"></label>
    <button id="reset">New world</button>
    <button id="save" title="Download this world and its settings as a file">Save</button>
    <button id="load" title="Continue from a saved file. Replaces the current world.">Load</button>
    <input id="load-file" type="file" accept=".json" hidden>
    <button id="largest" title="Zoom to the largest organism">Largest</button>
    <span id="stats"></span>
  </header>

  <aside id="left">
    <h2>World</h2>
    <p class="knob-note">Type any value in a box. Double-click a name to reset it.</p>
    <div id="knobs"></div>
    <button id="copy-settings" title="Copy seed and slider values to the clipboard">Copy settings</button>
    <h2>Overlay</h2>
    <select id="overlay">
      <option value="light">Light</option>
      <option value="vital">Vital</option>
      <option value="spent">Spent</option>
      <option value="detritus">Detritus</option>
      <option value="none">None</option>
    </select>
    <div id="legend"></div>
  </aside>

  <main id="world"><canvas id="world-canvas"></canvas></main>

  <aside id="right">
    <h2>Inspector</h2>
    <dl id="inspector"></dl>
  </aside>

  <footer id="bottom">
    <canvas id="graph-canvas" title="Each line is scaled to its own max"></canvas>
    <section id="species"></section>
    <div id="resize-graph" class="resize resize-x"></div>
  </footer>

  <div id="resize-left" class="resize resize-x"></div>
  <div id="resize-right" class="resize resize-x"></div>
  <div id="resize-bottom" class="resize resize-y"></div>
</body>
</html>
